<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade details – SecureTrade</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-transaction">
  <div class="app">

    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="dashboard.html">Secure<span>Trade</span></a>
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="dispute.html">Disputes</a>
      <a href="history.html">History</a>
      <a href="profile.html">My profile</a>
      <div class="spacer">
        <a href="login.html" id="signout">Sign out</a>
      </div>
    </nav>

    <main class="main">

      <p class="form-error" id="page-error" role="alert" hidden></p>

      <div id="trade-view" hidden>
        <header class="page-head">
          <div>
            <h1 id="title"></h1>
            <p id="subtitle"></p>
          </div>
          <span class="badge" id="status-badge"></span>
        </header>

        <div class="layout">

          <!-- Left: progress and actions -->
          <div class="stack">
            <section class="card" aria-labelledby="progress-title">
              <h2 id="progress-title">Trade progress</h2>
              <ol class="tracker" id="tracker"></ol>

              <h3 class="money-title">Where the money goes</h3>
              <div class="money" id="money"></div>

              <p class="notice" id="notice"></p>
              <div class="actions" id="actions"></div>
              <p class="form-error" id="action-error" role="alert" hidden></p>
            </section>

            <!-- Rate the other person (only after the trade is completed) -->
            <section class="card rate-card" id="rate-card" aria-label="Rate your trade partner" hidden></section>
          </div>

          <!-- Right: trade details, then the chat -->
          <div class="stack">
            <section class="card" aria-labelledby="details-title">
              <h2 id="details-title">Trade details</h2>
              <dl class="details" id="details"></dl>
            </section>

            <section class="card chat" aria-labelledby="chat-title">
              <h2 id="chat-title"></h2>
              <p class="chat-note">Admins can view this chat to keep trades safe.</p>
              <div class="messages" id="messages" aria-live="polite"></div>
              <form class="chat-form" id="chat-form">
                <input id="chat-input" type="text" placeholder="Write a message" aria-label="Message" autocomplete="off" maxlength="1000">
                <button class="btn btn-primary" type="submit">Send</button>
              </form>
            </section>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav-badge.js"></script>
  <script src="js/transaction.js"></script>
</body>
</html>
