<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade details – SecureTrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles (style.css stays unchanged) */
    .sidebar .brand { display: block; margin-bottom: 2rem; padding-left: .85rem; }
    .sidebar .spacer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--ink-3); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .page-head h1 { margin: 0; font-size: 1.9rem; }
    .page-head p { margin: .25rem 0 0; color: var(--text-soft); }

    .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
    .stack > * + * { margin-top: 1.5rem; }

    /* Status tracker */
    .tracker { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    .tracker li { position: relative; padding-top: 2.4rem; font-size: .88rem; color: var(--text-soft); }
    .tracker li::before {
      content: attr(data-n);
      position: absolute; top: 0; left: 0;
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center;
      font: 700 .85rem var(--font-display);
      background: #e4e6f6; color: var(--text-soft);
      z-index: 1;
    }
    .tracker li::after {
      content: "";
      position: absolute; top: 14px; left: 34px; right: -.5rem;
      height: 2px; background: #e4e6f6;
    }
    .tracker li:last-child::after { display: none; }
    .tracker strong { display: block; color: var(--text); font-family: var(--font-display); font-size: .95rem; }
    .tracker li.done::before { content: "✓"; background: var(--teal); color: var(--white); }
    .tracker li.done::after { background: var(--teal); }
    .tracker li.current::before { background: var(--gold); color: var(--ink); }

    .notice { margin: 1.25rem 0 0; padding: .85rem 1rem; background: #fff8e6; border-left: 4px solid var(--gold); border-radius: var(--radius-s); font-size: .92rem; }
    .notice.ok { background: #e3f7f2; border-color: var(--teal); }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.25rem; }

    .details { margin: 0; }
    .details .line { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid #e6e8f5; }
    .details dt { color: var(--text-soft); }
    .details dd { margin: 0; font-weight: 600; text-align: right; }

    .chat { display: flex; flex-direction: column; height: 360px; }
    .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .6rem; padding: .25rem .25rem 1rem; }
    .msg { max-width: 80%; padding: .6rem .85rem; border-radius: var(--radius-m); background: #eceef9; font-size: .95rem; }
    .msg small { display: block; color: var(--text-soft); font-size: .75rem; margin-bottom: .1rem; }
    .msg.me { align-self: flex-end; background: var(--ink); color: var(--text-on-dark); }
    .msg.me small { color: var(--text-on-dark-soft); }
    .chat-form { display: flex; gap: .5rem; border-top: 1px solid #e6e8f5; padding-top: .85rem; }
    .chat-form input { flex: 1; padding: .65rem .85rem; font: 1rem var(--font-body); border: 2px solid #d5d8ec; border-radius: var(--radius-s); }
    .chat-form input:focus { outline: none; border-color: var(--gold); }

    .evidence input[type="file"] { width: 100%; padding: .7rem; border: 2px dashed #c3c7e3; border-radius: var(--radius-s); background: var(--paper); }
    .files { list-style: none; margin: .75rem 0 0; padding: 0; font-size: .92rem; }
    .files li { padding: .35rem 0; border-bottom: 1px solid #e6e8f5; }

    @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .tracker { grid-template-columns: 1fr 1fr; row-gap: 1.25rem; } .tracker li::after { display: none; } }
  </style>
</head>
<body>
  <div class="app">

    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="dashboard.html">Secure<span>Trade</span></a>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-transaction.html">New trade</a>
      <a href="transaction.html" aria-current="page">My trades</a>
      <a href="dispute.html">Disputes</a>
      <a href="history.html">History</a>
      <div class="spacer">
        <a href="login.html">Sign out</a>
      </div>
    </nav>

    <main class="main">

      <header class="page-head">
        <div>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
        <span class="badge" id="status-badge"></span>
      </header>

      <div class="layout">

        <div class="stack">

          <section class="card" aria-labelledby="progress-title">
            <h2 id="progress-title">Trade progress</h2>
            <ol class="tracker" id="tracker"></ol>
            <p class="notice" id="notice"></p>
            <div class="actions" id="actions"></div>
          </section>

          <section class="card chat" aria-labelledby="chat-title">
            <h2 id="chat-title"></h2>
            <div class="messages" id="messages" aria-live="polite"></div>
            <form class="chat-form" id="chat-form">
              <input id="chat-input" type="text" placeholder="Write a message" aria-label="Message" autocomplete="off">
              <button class="btn btn-primary" type="submit">Send</button>
            </form>
          </section>

        </div>

        <div class="stack">

          <section class="card" aria-labelledby="details-title">
            <h2 id="details-title">Trade details</h2>
            <dl class="details" id="details"></dl>
          </section>

          <section class="card evidence" aria-labelledby="evidence-title">
            <h2 id="evidence-title">Evidence</h2>
            <p class="hint" style="margin-top:0" id="evidence-hint"></p>
            <label class="sr-only" for="evidence-file">Choose screenshots</label>
            <input id="evidence-file" type="file" accept="image/*" multiple>
            <ul class="files" id="files"></ul>
          </section>

        </div>
      </div>
    </main>
  </div>

  <script>
    // The same page serves both roles. Open it as transaction.html?role=seller for the seller view.
    const role = new URLSearchParams(location.search).get('role') === 'seller' ? 'seller' : 'buyer';

    const peso = n => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const TRADES = {
      buyer: {
        title: 'Genshin primogems (3,280)',
        subtitle: 'Trade #ST-1042 · You are the buyer',
        badge: ['badge-held', 'Waiting for your confirmation'],
        partner: '@paimon_ph', partnerLabel: 'Seller', game: 'Genshin Impact', price: 1500,
        steps: [
          ['done', 'Paid', 'Your ₱1,500 is held in escrow.'],
          ['done', 'Delivered', 'Seller says the item was sent.'],
          ['current', 'Your check', 'Confirm you received it.'],
          ['', 'Seller paid', 'Funds release to the seller.']
        ],
        notice: 'Check your game account first. If you do nothing, payment releases to the seller automatically in 1 hour 42 minutes.',
        primary: 'I received the item',
        evidence: 'Add screenshots that show what was delivered. They help if a dispute is opened.',
        chat: [['them', '2:14 PM', 'Sent the primogems to your UID. Please check.'], ['me', '2:16 PM', 'Checking now, thanks.']]
      },
      seller: {
        title: 'Mobile Legends account (Mythic)',
        subtitle: 'Trade #ST-1051 · You are the seller',
        badge: ['badge-held', 'Your turn: deliver the item'],
        partner: '@kuya_rico', partnerLabel: 'Buyer', game: 'Mobile Legends', price: 3000,
        steps: [
          ['done', 'Buyer paid', '₱3,000 is held in escrow.'],
          ['current', 'You deliver', 'Hand over the item in-game.'],
          ['', 'Buyer checks', 'Buyer confirms receipt.'],
          ['', 'You are paid', '₱2,910.00 releases to you.']
        ],
        notice: 'The payment is safe in escrow. Hand over the account in-game, then mark it as delivered. Take screenshots as proof.',
        primary: 'I delivered the item',
        evidence: 'Add screenshots that show what you delivered. They protect you if the buyer opens a dispute.',
        chat: [['them', '1:48 PM', 'I paid. Ready when you are.'], ['me', '1:51 PM', 'Sending the account details now.']]
      }
    };

    const t = TRADES[role];
    const fee = t.price * 0.03;
    const net = t.price - fee;

    // Header
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    const badge = document.getElementById('status-badge');
    badge.className = 'badge ' + t.badge[0];
    badge.textContent = t.badge[1];

    // Tracker
    const tracker = document.getElementById('tracker');
    function drawSteps(steps) {
      tracker.innerHTML = '';
      steps.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = s[0];
        li.dataset.n = i + 1;
        const strong = document.createElement('strong');
        strong.textContent = s[1];
        li.append(strong, document.createTextNode(s[2]));
        tracker.appendChild(li);
      });
    }
    drawSteps(t.steps);

    // Notice and actions
    const notice = document.getElementById('notice');
    const actions = document.getElementById('actions');
    notice.textContent = t.notice;

    function setActions(primaryText, onPrimary) {
      actions.innerHTML = '';
      if (primaryText) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn btn-primary';
        b.textContent = primaryText;
        b.addEventListener('click', onPrimary);
        actions.appendChild(b);
      }
      const d = document.createElement('a');
      d.className = 'btn btn-outline';
      d.href = 'dispute.html';
      d.textContent = 'Something is wrong';
      actions.appendChild(d);
    }

    function finish(text) {
      notice.className = 'notice ok';
      notice.textContent = text;
      actions.innerHTML = '<a class="btn btn-outline" href="dashboard.html">Back to dashboard</a>';
    }

    if (role === 'buyer') {
      setActions(t.primary, () => {
        drawSteps([['done', 'Paid', t.steps[0][2]], ['done', 'Delivered', t.steps[1][2]], ['done', 'Your check', 'You confirmed.'], ['done', 'Seller paid', 'Funds were released.']]);
        badge.className = 'badge badge-released';
        badge.textContent = 'Completed';
        finish('Thanks for confirming. ' + peso(net) + ' was released to ' + t.partner + '.');
      });
    } else {
      setActions(t.primary, () => {
        drawSteps([['done', 'Buyer paid', t.steps[0][2]], ['done', 'You delivered', 'Marked as delivered.'], ['current', 'Buyer checks', 'Waiting for confirmation.'], ['', 'You are paid', t.steps[3][2]]]);
        badge.className = 'badge badge-pending';
        badge.textContent = 'Waiting for buyer';
        notice.className = 'notice';
        notice.textContent = t.partner + ' has 2 hours to confirm. If they do not respond, ' + peso(net) + ' releases to you automatically.';
        setActions(null);
      });
    }

    // Details
    const rows = [
      ['Game', t.game],
      [t.partnerLabel, t.partner],
      ['Price', peso(t.price)],
      ['Service fee (3%)', peso(fee)],
      [role === 'seller' ? 'You receive' : 'Seller receives', peso(net)],
      ['Started', 'Oct 8, 2026']
    ];
    const dl = document.getElementById('details');
    rows.forEach(r => {
      const line = document.createElement('div');
      line.className = 'line';
      const dt = document.createElement('dt'); dt.textContent = r[0];
      const dd = document.createElement('dd'); dd.textContent = r[1];
      line.append(dt, dd);
      dl.appendChild(line);
    });

    // Evidence hint
    document.getElementById('evidence-hint').textContent = t.evidence;

    // Chat
    document.getElementById('chat-title').textContent = 'Chat with ' + t.partner;
    const box = document.getElementById('messages');
    function addMsg(who, time, text) {
      const msg = document.createElement('div');
      msg.className = 'msg' + (who === 'me' ? ' me' : '');
      const small = document.createElement('small');
      small.textContent = (who === 'me' ? 'You' : t.partner) + ' · ' + time;
      msg.append(small, document.createTextNode(text));
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }
    t.chat.forEach(m => addMsg(m[0], m[1], m[2]));

    const input = document.getElementById('chat-input');
    document.getElementById('chat-form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg('me', 'now', text);
      input.value = '';
    });

    // Evidence: list the chosen file names
    document.getElementById('evidence-file').addEventListener('change', e => {
      const list = document.getElementById('files');
      list.innerHTML = '';
      for (const f of e.target.files) {
        const li = document.createElement('li');
        li.textContent = f.name;
        list.appendChild(li);
      }
    });
  </script>
</body>
</html>
